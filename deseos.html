<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="alternate" hreflang="es" href="https://clabhf.github.io/aromario-web/deseos.html">
<link rel="alternate" hreflang="en" href="https://clabhf.github.io/aromario-web/en/wishlist.html">
<title>Mi lista de deseos — Aromario</title>
<meta name="description" content="Los perfumes que quiero, en mi lista de deseos de Aromario.">
<meta name="robots" content="noindex">
<meta property="og:title" content="Mi lista de deseos — Aromario">
<meta property="og:description" content="Los perfumes que quiero, en mi lista de deseos de Aromario.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://clabhf.github.io/aromario-web/images/og-deseos.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://clabhf.github.io/aromario-web/images/og-deseos.png">
<meta name="theme-color" content="#EEF4FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1520" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
.wl-head{padding:3.2rem 0 1.4rem;text-align:center}
.wl-head h1{font:500 clamp(2.2rem,6vw,3.4rem)/1.05 var(--display);color:var(--ink);margin:.2rem 0 .6rem}
.wl-head p{color:var(--muted);margin:0}
#wl-count{color:var(--steel);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.78rem}
#wishlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem;padding:1rem 0 1.6rem}
.wl-card{display:flex;gap:1rem;align-items:center;background:var(--glass);border:1px solid var(--glass-edge);border-radius:var(--r-md);padding:1rem;box-shadow:0 14px 34px -24px var(--shadow);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.wl-photo{flex:none;width:92px;height:116px;border-radius:var(--r-sm);background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.wl-photo img{width:100%;height:100%;object-fit:contain}
.wl-mono{font:500 2.4rem/1 var(--display);color:#1B3A5C}
.wl-text{min-width:0}
.wl-name{font:600 1.35rem/1.15 var(--display);color:var(--ink);margin:0 0 .2rem;overflow-wrap:anywhere}
.wl-brand{color:var(--steel);margin:0 0 .8rem;font-size:.9rem}
.wl-msg{grid-column:1/-1;text-align:center;color:var(--muted);padding:2rem 0}
.wl-foot{text-align:center;padding:.4rem 0 3rem}
.wl-note{color:var(--muted);font-size:.8rem;max-width:560px;margin:0 auto 1.4rem}
</style>
</head>
<body>
<main class="wrap">
  <header class="wl-head">
    <a class="logo" href="index.html">AROMARIO</a>
    <h1>Mi lista de deseos</h1>
    <p>Los perfumes que quiero. <span id="wl-count"></span></p>
  </header>
  <section id="wishlist" data-base="" aria-live="polite"></section>
  <div class="wl-foot">
    <p class="wl-note">Aviso de afiliado: si compras con estos enlaces, Aromario puede recibir una comisión, sin costo extra para ti.</p>
    <a class="btn btn-glass" href="https://play.google.com/store/apps/details?id=com.aromario.app" target="_blank" rel="noopener">Ábrela en Aromario</a>
  </div>
</main>
<script src="assets/deseos.js" defer></script>
</body>
</html>
