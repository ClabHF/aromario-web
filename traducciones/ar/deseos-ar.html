  <style>
.langsel{position:relative;display:inline-block}
.langsel-btn{background:none;border:0;font-size:1.25rem;line-height:1;cursor:pointer;color:inherit;padding:.35rem .5rem}
.langsel-menu{position:absolute;right:0;top:calc(100% + .35rem);min-width:11rem;background:#fff;color:#1B3A5C;border:1px solid rgba(27,58,92,.18);border-radius:.6rem;box-shadow:0 10px 30px rgba(27,58,92,.18);padding:.35rem;z-index:60;display:flex;flex-direction:column}
.langsel-menu[hidden]{display:none}
.langsel-menu a,.langsel-menu button{display:block;width:100%;text-align:left;background:none;border:0;font:inherit;font-size:.95rem;padding:.45rem .6rem;border-radius:.4rem;color:inherit;text-decoration:none;cursor:pointer;box-sizing:border-box}
.langsel-menu a:hover,.langsel-menu button:hover{background:rgba(174,198,221,.35)}
.langsel-menu .current{font-weight:600}
</style>
<div class="langsel">
<button class="langsel-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="اللغة / Language">☰</button>
<div class="langsel-menu" role="menu" hidden>
<button type="button" role="menuitem" data-langsel="auto">تلقائي</button>
<a href="../es/deseos.html" role="menuitem" hreflang="es" lang="es" data-langsel="es">Español</a>
<a href="../en/deseos.html" role="menuitem" hreflang="en" lang="en" data-langsel="en">English</a>

<a href="#" role="menuitem" hreflang="ar" lang="ar" data-langsel="ar" class="current" aria-current="true">العربية</a>
<a href="../tr/deseos.html" role="menuitem" hreflang="tr" lang="tr" data-langsel="tr">Türkçe</a>
<a href="../pl/deseos.html" role="menuitem" hreflang="pl" lang="pl" data-langsel="pl">Polski</a>
</div>
</div>
<script>
(function(){
var URLS={es:"../es/deseos.html",en:"../en/deseos.html",pt:"../pt/deseos.html",fr:"../fr/deseos.html",de:"../de/deseos.html",it:"../it/deseos.html",ar:null,tr:"../tr/deseos.html",pl:"../pl/deseos.html"};
var CUR="ar",KEY="aromario_langsel";
function sys(){var l=(navigator.language||"").toLowerCase();if(l.indexOf("es")===0)return "es";if(l.indexOf("pt")===0)return "pt";if(l.indexOf("fr")===0)return "fr";if(l.indexOf("de")===0)return "de";if(l.indexOf("it")===0)return "it";if(l.indexOf("ar")===0)return "ar";if(l.indexOf("tr")===0)return "tr";if(l.indexOf("pl")===0)return "pl";if(l.indexOf("en")===0)return "en";return "es";}
function go(lang){if(!lang||lang===CUR)return;var u=URLS[lang];if(u)location.href=u;}
try{var pref=localStorage.getItem(KEY);if(pref&&pref!=="auto"){go(pref);}else{go(sys());}}catch(e){}
var root=document.querySelector(".langsel");if(!root)return;
var btn=root.querySelector(".langsel-btn"),menu=root.querySelector(".langsel-menu");
function close(){menu.hidden=true;btn.setAttribute("aria-expanded","false");}
btn.addEventListener("click",function(ev){ev.stopPropagation();var open=menu.hidden;menu.hidden=!open;btn.setAttribute("aria-expanded",String(open));});
document.addEventListener("click",function(ev){if(!root.contains(ev.target))close();});
document.addEventListener("keydown",function(ev){if(ev.key==="Escape")close();});
menu.querySelector('[data-langsel="auto"]').addEventListener("click",function(){try{localStorage.setItem(KEY,"auto");}catch(e){}close();go(sys());});
menu.querySelectorAll("a[data-langsel]").forEach(function(a){a.addEventListener("click",function(){try{localStorage.setItem(KEY,a.getAttribute("data-langsel"));}catch(e){});});});
})();
</script>
